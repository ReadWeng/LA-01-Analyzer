name: Streamlit 24/7 Keep-Alive Daemon

on:
  schedule:
    # 每 10 分鐘自動觸發一次 (UTC 時間)，防止 Streamlit Community Cloud 休眠
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即執行

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行防休眠保活與自動喚醒檢測
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          # 若有設定 GitHub Secret "STREAMLIT_APP_URL" 則使用 Secret，否則可手動傳入參數
          if [ -n "$STREAMLIT_APP_URL" ]; then
            python streamlit_pinger.py --urls "$STREAMLIT_APP_URL" --once
          else
            echo "ℹ️ 請於 GitHub Repo -> Settings -> Secrets and variables -> Actions 中新增 STREAMLIT_APP_URL"
            echo "   或直接在指令中指定您的 Streamlit 網址。"
          fi
